[project]
name = "horizon-trader"
version = "0.1.0"
description = "Multi-horizon (swing + position) systematic trading system for US equities/ETFs via IBKR"
readme = "README.md"
authors = [
    { name = "Henry Chen", email = "henrychen0214@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "boto3>=1.43.102",
    "ib-async>=2.1.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "yfinance>=1.7.0",
]

[project.scripts]
horizon-trader = "horizon_trader.run_daily:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dashboard = [
    "plotly>=7.1.0",
    "streamlit>=1.64.0",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
research = [
    "jupyter>=1.1.1",
    "lightgbm>=4.7.0",
    "vectorbt>=1.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev", "dashboard"]
